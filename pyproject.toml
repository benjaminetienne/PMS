[project]
name = "pms"
version = "0.1.0"
description = "Lightweight, local-first hybrid search engine and web clipper for Markdown knowledge bases (SQLite FTS5 + sqlite-vec + ONNX embeddings)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Benjamin Etienne" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.1",
    "fastembed>=0.9.0",
    "pydantic>=2.0",
    "python-slugify>=9.1.3",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
